version: '3.8'

services:
  mermaid:
    image: mermaid-local:latest
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          memory: 1G
    env_file:
      - .env
    volumes:
      # Alterado para volume nomeado para evitar erro de path no Portainer
      - mermaid_data:/mermaid 
      - root_cache:/root/.cache
      - root_local:/root/.local
      - root_npm:/root/.npm
      - /tmp:/tmp
    ports:
      - ${MERMAID_PORT}:${MERMAID_PORT}
      - 3333:3333

  cypress:
    image: cypress/included:14.0.3
    deploy:
      resources:
        limits:
          memory: 2G
    entrypoint: cypress
    environment:
      - DISPLAY
    volumes:
      - mermaid_data:/mermaid
      - /tmp/.X11-unix:/tmp/.X11-unix

volumes:
  mermaid_data: # Novo volume adicionado aqui
  root_cache:
  root_local:
  root_npm:
