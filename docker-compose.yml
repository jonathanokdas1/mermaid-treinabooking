version: '3.8'

services:
  mermaid:
    # Adicione esta linha abaixo para dar um nome à imagem que será construída
    image: mermaid-local:latest
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    working_dir: /mermaid
    deploy:
      resources:
        limits:
          memory: 1G
    env_file:
      - .env
    volumes:
      - ./:/mermaid
      - root_cache:/root/.cache
      - root_local:/root/.local
      - root_npm:/root/.npm
      - /tmp:/tmp
    ports:
      - ${MERMAID_PORT}:${MERMAID_PORT}
      - 3333:3333

  cypress:
    image: cypress/included:14.0.3
    stdin_open: true
    tty: true
    working_dir: /mermaid
    deploy:
      resources:
        limits:
          memory: 2G
    entrypoint: cypress
    environment:
      - DISPLAY
    volumes:
      - ./:/mermaid
      - /tmp/.X11-unix:/tmp/.X11-unix
    # O aviso "Ignoring unsupported options: network_mode" ocorre porque o Swarm não aceita 'host'.
    # Se você não estiver usando Swarm, pode manter. Se estiver no Swarm, remova a linha abaixo.
    network_mode: host

volumes:
  root_cache:
  root_local:
  root_npm:
